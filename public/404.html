<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI/ML Study Planner</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and redirects the browser to a URL with a path and query string
      // that can be read by index.html to restore the correct client-side route without a 404.
      
      // If hosted on GitHub Pages (e.g. devmaroof.github.io/SpO2), keep 1 path segment (/SpO2).
      // If hosted on a custom domain root, keep 0 path segments.
      var pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
